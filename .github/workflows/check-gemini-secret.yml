name: Check Gemini Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check GEMINI_API_KEY exists
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "missing"
            exit 1
          else
            echo "present"
          fi
